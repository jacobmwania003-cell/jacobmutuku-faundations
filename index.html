<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1155c4">
<link rel="icon" href="icon.svg">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#1b2430}
.flag{height:8px;background:linear-gradient(90deg,#1155c4 33%,#e00 33% 66%,#ffd400 66%)}
.wrap{max-width:520px;margin:0 auto;padding:14px}
h1{color:#1155c4;font-size:24px;margin:8px 0}
.badge{display:inline-block;background:#ffd400;border-radius:12px;padding:3px 10px;font-weight:bold;font-size:13px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:12px 0}
.tabs button{flex:0 0 auto;padding:10px 14px;border:1px solid #cfd8e3;background:#fff;border-radius:10px;font-size:15px}
.tabs button.on{background:#1155c4;color:#fff;border-color:#1155c4}
.card{background:#fff;border:1px solid #dde4ee;border-radius:12px;padding:12px;margin:8px 0}
.tap{cursor:pointer;border-left:5px solid #1155c4}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid .card{margin:0}
.grid small{color:#5b6877}
.grid b{display:block;font-size:22px;margin-top:4px}
input,select,button.act{width:100%;padding:12px;margin:4px 0;font-size:16px;border-radius:8px;border:1px solid #9aa7b6}
button.act{background:#1155c4;color:#fff;border:none}
button.small{padding:8px 12px;border:none;border-radius:8px;background:#2e9e4f;color:#fff;margin:4px 4px 0 0;font-size:14px}
button.red{background:#c0392b}
button.grey{background:#5b6877}
.row{display:flex;align-items:center;gap:10px;margin:4px 0}
.row span{flex:1;font-size:15px}
.row input{width:100px;margin:0}
.r3 input{width:70px;padding:10px 4px;text-align:center}
.row .h{flex:0 0 70px;text-align:center;font-size:12px;color:#5b6877}
.lbl{color:#5b6877;font-size:14px;margin-top:8px}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:8px;vertical-align:-2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.out{color:#c0392b;font-weight:bold}
.ok{color:#2e9e4f;font-weight:bold}
.muted{color:#5b6877;font-size:13px}
#toast{position:fixed;left:10px;right:10px;top:14px;background:#2e9e4f;color:#fff;padding:14px;border-radius:10px;display:none;z-index:9;font-size:16px}
.err{color:#c0392b;margin:6px 0}
.top{display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<div class="flag"></div>
<div class="wrap" id="app"></div>
<div id="toast"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,addDoc,deleteDoc,doc,updateDoc,setDoc,onSnapshot,query,where} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDLDw73TgCaItVk_F2Nj-Q0VpqWGQCiqKc",
  authDomain: "jacobmutuku-foundations.firebaseapp.com",
  projectId: "jacobmutuku-foundations",
  storageBucket: "jacobmutuku-foundations.firebasestorage.app",
  messagingSenderId: "287620971591",
  appId: "1:287620971591:web:f75597352d897efc368562"
};
const fb = initializeApp(firebaseConfig);
const auth = getAuth(fb);
const db = getFirestore(fb);
const OWNER = "jacobmwania003@gmail.com";
const FLAVORS = ["Mango", "Orange", "Pineapple", "Strawberry", "Ukwaju", "Savings tub"];
const COLORS = {"Mango": "#f5a800", "Orange": "#ff7a00", "Pineapple": "#f4d03f", "Strawberry": "#e0243c", "Ukwaju": "#8a5a3c", "Savings tub": "#2aa5a0"};
const dot = n => '<span class="dot" style="background:' + (COLORS[n] || "#9aa7b6") + '"></span>';
const DEFAULT_PRICE = 10;
const SELLER_RATE = 0.35;
const pay = n => Math.round((Number(n) || 0) * SELLER_RATE);

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const kes = n => "KSh " + Number(n || 0).toLocaleString();
const sum = (arr, f) => arr.reduce((a, x) => a + (Number(f(x)) || 0), 0);
const low = s => String(s || "").toLowerCase();

let user = null, isOwner = false, tab = "summary", selSeller = null;
let data = {products: [], trips: [], sales: [], expenses: [], users: [], sellers: []};
let unsubs = [];

function toast(msg){
  const t = $("toast"); t.textContent = msg; t.style.display = "block";
  setTimeout(() => t.style.display = "none", 6000);
}

function showLogin(err){
  $("app").innerHTML = '<h1>🍧 JacobMutuku foundations</h1><div class="card">' +
    '<input id="em" type="email" placeholder="Email">' +
    '<input id="pw" type="password" placeholder="Password">' +
    '<button class="act" onclick="login()">Log in</button>' +
    '<div class="err">' + esc(err || "") + '</div></div>';
}

window.login = async () => {
  try { await signInWithEmailAndPassword(auth, $("em").value.trim(), $("pw").value); }
  catch(e){ showLogin("Wrong email or password."); }
};
window.logout = () => signOut(auth);

function shell(){
  const tabs = isOwner
    ? [["summary","Summary"],["sellers","Sellers"],["trips","Trips"],["sales","Sales"],["expenses","Expenses"],["made","Made"],["products","Products"]]
    : [["sales","Sales"],["trips","Trips"],["products","Products"]];
  $("app").innerHTML =
    '<div class="top"><h1>🍧 JacobMutuku foundations</h1><button class="small red" onclick="logout()">Log out</button></div>' +
    '<span class="badge">' + (isOwner ? "Owner" : "Seller") + '</span> <span class="muted">' + esc(user.email) + '</span>' +
    '<div class="tabs">' + tabs.map(t => '<button id="t_'+t[0]+'" onclick="setTab(\''+t[0]+'\')">'+t[1]+'</button>').join("") + '</div>' +
    '<div id="content"></div>';
  setTab(tab);
}

window.setTab = t => {
  tab = t; selSeller = null;
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.id === "t_" + t));
  let f = "";
  if (t === "trips") f = '<div class="card"><b>New trip: pops given to a seller</b>' +
    '<div class="two"><div><div class="lbl">Seller</div>' + (isOwner ? '<select id="tby"></select>' : '<input id="tname" placeholder="Your name">') + '</div>' +
    '<div><div class="lbl">Date</div><input id="tdate" type="date" value="' + today() + '" max="' + today() + '" onchange="pastDate()"></div></div>' +
    '<div class="lbl">Status</div><select id="tstat"><option value="out">Still out selling</option><option value="back">Came back</option></select>' +
    '<div class="muted" style="margin:8px 0">In the morning, fill Taken and keep "Still out selling". In the evening, open the trip below, fill Returned and Damaged, and tap End trip.</div>' +
    '<div class="row r3 muted"><span>Flavour</span><span class="h">Taken</span><span class="h">Returned</span><span class="h">Damaged</span></div>' +
    FLAVORS.map((n, i) => '<div class="row r3"><span>' + dot(n) + esc(n) + '</span><input id="tk' + i + '" type="number" min="0" inputmode="numeric"><input id="br' + i + '" type="number" min="0" inputmode="numeric"><input id="dm' + i + '" type="number" min="0" inputmode="numeric"></div>').join("") +
    '<div class="row r3"><span><input id="oname" placeholder="Other flavour" style="width:100%;text-align:left;padding:10px"></span><input id="tkx" type="number" min="0" inputmode="numeric"><input id="brx" type="number" min="0" inputmode="numeric"><input id="dmx" type="number" min="0" inputmode="numeric"></div>' +
    '<button class="act" onclick="addTrip()">Save trip</button></div>';
  if (t === "sales") f = '<div class="card"><b>Add a sale</b>' +
    '<div class="lbl">Sold by</div>' +
    (isOwner ? '<select id="sby"></select>' : '<input id="sname" placeholder="Your name">') +
    '<div class="lbl">Flavour</div><input id="flav" list="flavlist" placeholder="e.g. Mango"><datalist id="flavlist">' + FLAVORS.map(n => '<option value="' + esc(n) + '">').join("") + '</datalist>' +
    '<div class="two"><div><div class="lbl">How many</div><input id="qty" type="number" min="0" inputmode="numeric"></div>' +
    '<div><div class="lbl">Price for one (KSh)</div><input id="price" type="number" min="0" inputmode="numeric" value="10"></div></div>' +
    '<div class="lbl">Customer (not needed)</div><input id="cust">' +
    '<div class="two"><div><div class="lbl">Date</div><input id="sdate" type="date" value="' + today() + '" max="' + today() + '"></div>' +
    '<div><div class="lbl">Payment</div><select id="pay"><option value="paid">Paid</option><option value="unpaid">Not paid yet</option></select></div></div>' +
    '<button class="act" style="background:#e00613" onclick="addSale()">Save</button></div>';
  if (t === "sales" && isOwner) f = '<div class="card"><b>Flavors left in chest freezer</b>' +
    '<input id="fsearch" type="search" placeholder="Search flavor (e.g. Mango)" oninput="flvSearch()"><div id="flv"></div></div>' + f;
  if (t === "expenses") f = '<div class="card"><b>Add money spent</b><input id="item" placeholder="What for? (e.g. sugar, fruit)"><input id="amt" type="number" placeholder="Amount (KSh)">' +
    '<div class="muted">Pops made (optional). Fill each flavor, or only the total box.</div>' +
    FLAVORS.map((n, i) => '<label class="row"><span>' + esc(n) + '</span><input id="mk' + i + '" type="number" min="0" inputmode="numeric" placeholder="0"></label>').join("") +
    '<input id="made" type="number" placeholder="Total pops made (if no flavors)">' +
    '<button class="act" onclick="addExpense()">Save</button></div>';
  if (t === "made") f = '<div class="card"><b>Add pops you made</b>' +
    '<div class="lbl">Flavour</div><input id="mflav" list="flavlist" placeholder="e.g. Mango"><datalist id="flavlist">' + FLAVORS.map(n => '<option value="' + esc(n) + '">').join("") + '</datalist>' +
    '<div class="two"><div><div class="lbl">How many</div><input id="mqty" type="number" inputmode="numeric"></div>' +
    '<div><div class="lbl">Date</div><input id="mdate" type="date" value="' + today() + '" max="' + today() + '"></div></div>' +
    '<div class="muted" style="margin-top:6px">To fix the stock, type a minus number (for example -4).</div>' +
    '<button class="act" style="background:#e00613" onclick="addMade()">Save</button></div>';
  if (t === "products" && isOwner) f = '<div class="card"><b>Add a flavor</b><input id="pname" placeholder="Flavor (e.g. Mango)"><input id="pprice" type="number" placeholder="Price (KSh)"><button class="act" onclick="addProduct()">Add flavor</button></div>';
  if (t === "sellers") f = '<div class="card"><b>Add a seller to my list</b><input id="semail" type="email" placeholder="Seller email"><button class="act" onclick="addSeller()">Add seller</button><div class="muted">The seller must also have a login in Firebase Authentication.</div></div>';
  $("content").innerHTML = f + '<div id="list"></div>';
  if ((t === "sales" || t === "trips") && !isOwner){ try { $(t === "sales" ? "sname" : "tname").value = localStorage.getItem("sellerName") || ""; } catch(e){} }
  refresh();
};

function sellerEmails(){
  const set = {};
  data.users.forEach(u => { const k = low(u.email); if (k) set[k] = {email: u.email, key: k, lastLogin: u.lastLogin}; });
  data.sellers.forEach(s => { const k = low(s.email); if (!k) return; if (!set[k]) set[k] = {email: s.email, key: k}; set[k].docId = s.id; });
  data.sales.concat(data.trips).forEach(x => { const k = low(x.email); if (k && !set[k]) set[k] = {email: x.email, key: k}; });
  delete set[OWNER];
  return Object.values(set).sort((a, b) => a.key < b.key ? -1 : 1);
}
function stats(k, d){
  const ym = d.slice(0, 7);
  const S = data.sales.filter(x => low(x.email) === k);
  const T = data.trips.filter(x => low(x.email) === k);
  const all = sum(S, x => x.total), exp = expected(T);
  return {
    S: S, T: T,
    today: sum(S.filter(x => x.date === d), x => x.total),
    month: sum(S.filter(x => (x.date||"").startsWith(ym)), x => x.total),
    all: all, exp: exp, diff: all - exp,
    unpaid: sum(S.filter(x => !x.paid), x => x.total),
    sold: sum(S, x => x.qty),
    out: sum(T.filter(x => x.returned == null), x => x.taken)
  };
}
const kAttr = k => encodeURIComponent(k).replace(/'/g, "%27");

function priceOf(n){
  const p = data.products.find(x => low(x.name) === low(n));
  return p ? (Number(p.price) || DEFAULT_PRICE) : DEFAULT_PRICE;
}
function expected(T){
  let m = 0;
  T.filter(t => t.returned != null).forEach(t => {
    if (t.items && Object.keys(t.items).length){
      Object.keys(t.items).forEach(n => { m += ((t.items[n].taken || 0) - (t.items[n].returned || 0) - (t.items[n].damaged || 0)) * priceOf(n); });
    } else {
      m += ((t.taken || 0) - (t.returned || 0) - (t.damaged || 0)) * DEFAULT_PRICE;
    }
  });
  return m;
}
const gl = n => n === 0 ? '<span class="ok">Matches</span>' : (n < 0 ? '<span class="out">Loss ' + kes(-n) + '</span>' : '<span class="ok">Gain ' + kes(n) + '</span>');

function tripStatus(t){
  return 'Taken: <b>' + t.taken + '</b> | ' + (t.returned == null ? '<span class="out">Still out</span>'
    : 'Returned: <b>' + t.returned + '</b>' + (t.damaged ? ' | Damaged: <b>' + t.damaged + '</b>' : '') + ' <span class="ok">Done</span>');
}
function tripItems(t){
  const ks = Object.keys(t.items || {});
  if (!ks.length) return "";
  return '<div class="muted">' + ks.map(n =>
    esc(n) + ": took " + t.items[n].taken + (t.returned != null ? ", back " + (t.items[n].returned || 0) + (t.items[n].damaged ? ", damaged " + t.items[n].damaged : "") : "")
  ).join("<br>") + '</div>';
}
function returnForm(t){
  const ks = Object.keys(t.items || {});
  return '<div class="row r3 muted"><span>End the trip</span><span class="h">Back</span><span class="h">Damaged</span></div>' + ks.map((n, i) =>
    '<div class="row r3"><span>' + dot(n) + esc(n) + ' (took ' + t.items[n].taken + ')</span><input id="rt_' + t.id + '_' + i + '" type="number" min="0" inputmode="numeric" placeholder="0"><input id="rd_' + t.id + '_' + i + '" type="number" min="0" inputmode="numeric" placeholder="0"></div>'
  ).join("") + '<button class="small" onclick="endTrip(\'' + t.id + '\')">End trip</button>';
}
function saleLine(x){
  return '<b>' + x.qty + ' × ' + esc(x.product) + '</b> = ' + kes(x.total) +
    (x.price ? ' <span class="muted">(' + kes(x.price) + ' each)</span>' : '') +
    (x.seller ? '<br>Seller: <b>' + esc(x.seller) + '</b>' : '') +
    (x.customer ? '<br>Customer: ' + esc(x.customer) : '');
}
function flavorStats(){
  const fl = {};
  const get = n => fl[n] || (fl[n] = {made: 0, taken: 0, back: 0, out: 0});
  FLAVORS.forEach(n => get(n));
  data.expenses.forEach(x => { if (x.items) Object.keys(x.items).forEach(n => { get(n).made += Number(x.items[n]) || 0; }); });
  data.trips.forEach(t => { if (t.items) Object.keys(t.items).forEach(n => {
    const f = get(n), it = t.items[n];
    f.taken += it.taken || 0;
    if (t.returned != null) f.back += it.returned || 0; else f.out += it.taken || 0;
  }); });
  return fl;
}
function flavorHtml(q){
  const fl = flavorStats();
  const k = low(String(q || "").trim());
  const rows = Object.keys(fl).filter(n => !k || low(n).includes(k)).map(n => {
    const f = fl[n], left = f.made - f.taken + f.back;
    return '<div style="padding:8px 0;border-top:1px solid #eef2f7">' + dot(n) + '<b>' + esc(n) + '</b>: ' +
      (left < 0 ? '<b>0</b> <span class="out">(add ' + (-left) + ' in Made)</span>' : '<b>' + left + '</b>') +
      ' in freezer · ' + f.out + ' with sellers</div>';
  }).join("");
  return (rows || '<div class="muted">No flavor found.</div>') +
    '<div class="muted">Pops made are counted from the Made tab.</div>';
}
window.flvSearch = () => refresh();

function sellerCards(d){
  const L = sellerEmails();
  if (!L.length) return '<div class="muted">No sellers yet. Add a seller email above.</div>';
  return L.map(u => {
    const s = stats(u.key, d);
    const seen = u.lastLogin ? new Date(u.lastLogin).toLocaleString() : "Not logged in yet";
    return '<div class="card tap" onclick="openSeller(\'' + kAttr(u.key) + '\')"><b>' + esc(u.email) + '</b><br>' +
      (s.out > 0 ? '<span class="out">Out selling: ' + s.out + ' pops</span>' : '<span class="ok">Not out</span>') +
      '<br>Sales today: <b>' + kes(s.today) + '</b> · All: <b>' + kes(s.all) + '</b>' +
      '<br>Should bring: <b>' + kes(s.exp) + '</b> · ' + gl(s.diff) +
      '<br>Pay (' + Math.round(SELLER_RATE * 100) + '%): today <b>' + kes(pay(s.today)) + '</b> · month <b>' + kes(pay(s.month)) + '</b> · all <b>' + kes(pay(s.all)) + '</b>' +
      '<br><span class="muted">Last login: ' + esc(seen) + ' · Tap to open</span></div>';
  }).join("");
}

function sellerDetail(k, d){
  const s = stats(k, d);
  const u = sellerEmails().find(x => x.key === k) || {email: k};
  let h = '<button class="small grey" onclick="setTab(\'sellers\')">← Back to sellers</button>';
  h += '<h1 style="font-size:20px">' + esc(u.email) + '</h1>';
  h += '<div class="grid">' +
    c("Sales today", kes(s.today)) + c("Sales this month", kes(s.month)) +
    c("All sales", kes(s.all)) + c("Not paid", kes(s.unpaid)) +
    c("Pops out now", s.out) + c("Pops sold", s.sold) +
    c("Should bring", kes(s.exp)) + c("Gain / loss", gl(s.diff)) +
    c("Pay this month (" + Math.round(SELLER_RATE * 100) + "%)", kes(pay(s.month))) + c("Pay all time (" + Math.round(SELLER_RATE * 100) + "%)", kes(pay(s.all))) + '</div>';
  h += '<div class="card"><b>Trips</b></div>';
  h += s.T.length ? s.T.map(t =>
    '<div class="card"><b>' + esc(t.date) + '</b><br>' + tripStatus(t) +
    tripItems(t) + '</div>'
  ).join("") : '<div class="muted">No trips yet.</div>';
  h += '<div class="card"><b>Sales</b></div>';
  h += s.S.length ? s.S.map(x =>
    '<div class="card">' + saleLine(x) +
    '<br><span class="muted">' + esc(x.date) + '</span> ' +
    (x.paid ? '<span class="ok">Paid</span>' : '<span class="out">Not paid</span><br><button class="small" onclick="paySale(\'' + x.id + '\')">Mark paid</button>') + '</div>'
  ).join("") : '<div class="muted">No sales yet.</div>';
  if (u.docId) h += '<button class="small red" onclick="delItem(\'sellers\',\'' + u.docId + '\');setTab(\'sellers\')">Remove from my list</button>';
  return h;
}

window.openSeller = k => {
  selSeller = decodeURIComponent(k);
  $("content").innerHTML = '<div id="list"></div>';
  refresh();
};
function refresh(){
  const list = $("list"); if (!list) return;
  const fv = $("flv"); if (fv) fv.innerHTML = flavorHtml($("fsearch").value);
  ["sby", "tby"].forEach(id => {
    const sb = $(id);
    if (sb){
      const v = sb.value;
      sb.innerHTML = '<option value="__me">Jacob (you)</option>' + sellerEmails().map(u => '<option value="' + esc(u.email) + '">' + esc(u.email) + '</option>').join("");
      if (v) sb.value = v;
    }
  });
  let h = "";
  const d = today(), ym = d.slice(0, 7);

  if (tab === "summary"){
    const s = data.sales, e = data.expenses;
    const salesToday = sum(s.filter(x => x.date === d), x => x.total);
    const salesMonth = sum(s.filter(x => (x.date||"").startsWith(ym)), x => x.total);
    const unpaid = sum(s.filter(x => !x.paid), x => x.total);
    const spentMonth = sum(e.filter(x => (x.date||"").startsWith(ym)), x => x.amount);
    const made = sum(e, x => x.qty);
    const takenAll = sum(data.trips, x => x.taken);
    const backAll = sum(data.trips.filter(x => x.returned != null), x => x.returned);
    const withSellers = sum(data.trips.filter(x => x.returned == null), x => x.taken);
    const freezer = made - takenAll + backAll;
    const damagedAll = sum(data.trips.filter(x => x.returned != null), x => x.damaged);
    const sold = sum(s, x => x.qty);
    let totExp = 0, totDiff = 0, payToday = 0, payMonth = 0;
    sellerEmails().forEach(u => { const st = stats(u.key, d); totExp += st.exp; totDiff += st.diff; payToday += pay(st.today); payMonth += pay(st.month); });
    const fl = flavorStats();
    const flRows = Object.keys(fl).filter(n => fl[n].made || fl[n].taken).map(n =>
      '<div class="card">' + dot(n) + '<b>' + esc(n) + '</b><br>In freezer: <b>' + Math.max(0, fl[n].made - fl[n].taken + fl[n].back) + '</b> · With sellers: <b>' + fl[n].out + '</b></div>'
    ).join("");
    h += '<div class="grid">' +
      c("Sales today", kes(salesToday)) + c("Sales this month", kes(salesMonth)) +
      c("Not paid yet", kes(unpaid)) + c("Spent this month", kes(spentMonth)) +
      c("Profit this month", kes(salesMonth - spentMonth)) +
      c("Pops made (total)", made) + c("Pops sold (total)", sold) +
      c("In chest freezer", Math.max(0, freezer)) + c("With sellers now", withSellers) +
      c("Should bring (finished trips)", kes(totExp)) + c("Sellers gain / loss", gl(totDiff)) +
      c("Damaged pops", damagedAll) +
      c("Seller pay today (" + Math.round(SELLER_RATE * 100) + "%)", kes(payToday)) + c("Seller pay this month", kes(payMonth)) +
      c("Profit after seller pay", kes(salesMonth - spentMonth - payMonth)) + '</div>';
    if (freezer < 0) h += '<div class="card"><span class="out">The freezer shows 0.</span> <span class="muted">Pops taken are ' + (-freezer) + ' more than pops made. Add the missing pops in the Made tab to get the exact number.</span></div>';
    if (flRows) h += '<div class="card"><b>Stock by flavor</b></div>' + flRows;
    h += '<div class="card"><b>Sellers</b></div>' + sellerCards(d);
  }

  if (tab === "sellers"){
    h += selSeller ? sellerDetail(selSeller, d) : sellerCards(d);
  }

  if (tab === "trips"){
    h += data.trips.length ? data.trips.map(t =>
      '<div class="card"><b>' + esc(t.date) + '</b>' + (t.seller ? ' · <b>' + esc(t.seller) + '</b>' : '') + (isOwner ? ' <span class="muted">' + esc(t.email) + '</span>' : '') +
      '<br>' + tripStatus(t) +
      tripItems(t) +
      (t.returned == null ? '<br>' + returnForm(t) : '') +
      (isOwner ? '<br><button class="small red" onclick="delItem(\'trips\',\''+t.id+'\')">Delete</button>' : '') + '</div>'
    ).join("") : '<div class="muted">No trips yet.</div>';
  }

  if (tab === "sales"){
    const mine = sum(data.sales.filter(x => x.date === d), x => x.total);
    h += '<div class="card">Sales today: <b>' + kes(mine) + '</b></div>';
    if (!isOwner){
      const mo = sum(data.sales.filter(x => (x.date||"").startsWith(ym)), x => x.total);
      const al = sum(data.sales, x => x.total);
      h += '<div class="card"><b>Your pay (' + Math.round(SELLER_RATE * 100) + '% of your sales)</b><br>Today: <b>' + kes(pay(mine)) + '</b> · This month: <b>' + kes(pay(mo)) + '</b> · All: <b>' + kes(pay(al)) + '</b></div>';
    }
    h += data.sales.length ? data.sales.map(x =>
      '<div class="card">' + saleLine(x) +
      '<br><span class="muted">' + esc(x.date) + (isOwner ? ' · ' + esc(x.email) : '') + '</span> ' +
      (x.paid ? '<span class="ok">Paid</span>' : '<span class="out">Not paid</span><br><button class="small" onclick="paySale(\''+x.id+'\')">Mark paid</button>') +
      (isOwner ? '<button class="small red" onclick="delItem(\'sales\',\''+x.id+'\')">Delete</button>' : '') + '</div>'
    ).join("") : '<div class="muted">No sales yet.</div>';
  }

  if (tab === "made"){
    const L = data.expenses.filter(x => x.kind === "made");
    h += '<div class="card"><b>History</b>' + (L.length ? L.map(x =>
      '<div style="display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid #eef2f7"><div>' + dot(x.item) + '<b>' + esc(x.item) + '</b><br><span class="muted">' + esc(x.date) + '</span></div>' +
      '<div style="text-align:right"><b style="font-size:20px">' + x.qty + '</b><br><button class="small" onclick="editMade(\''+x.id+'\')">Edit</button><button class="small red" onclick="delItem(\'expenses\',\''+x.id+'\')">Delete</button></div></div>'
    ).join("") : '<div class="muted">Nothing added yet.</div>') + '</div>';
  }

  if (tab === "expenses"){
    const EX = data.expenses.filter(x => x.kind !== "made");
    h += EX.length ? EX.map(x =>
      '<div class="card"><b>' + esc(x.item) + '</b> - ' + kes(x.amount) + (x.qty ? ' · ' + x.qty + ' pops made' : '') +
      '<br><span class="muted">' + esc(x.date) + '</span><button class="small red" onclick="delItem(\'expenses\',\''+x.id+'\')">Delete</button></div>'
    ).join("") : '<div class="muted">Nothing spent yet.</div>';
  }

  if (tab === "products"){
    h += data.products.length ? data.products.map(p =>
      '<div class="card"><b>' + esc(p.name) + '</b> - ' + kes(p.price) +
      (isOwner ? '<button class="small red" onclick="delItem(\'products\',\''+p.id+'\')">Delete</button>' : '') + '</div>'
    ).join("") : '<div class="muted">No flavors yet.</div>';
  }
  list.innerHTML = h;
}
function c(a, b){ return '<div class="card"><small>' + a + '</small><b>' + b + '</b></div>'; }

window.addSeller = async () => {
  const e = low($("semail").value.trim());
  if (!e || e.indexOf("@") < 1) return alert("Type the seller email.");
  await addDoc(collection(db, "sellers"), {email: e, ts: Date.now()});
  $("semail").value = "";
};
window.pastDate = () => {
  const v = $("tdate").value;
  $("tstat").value = (v && v < today()) ? "back" : "out";
};
window.addTrip = async () => {
  const date = $("tdate").value || today();
  if (date > today()) return alert("The date cannot be in the future.");
  const done = $("tstat").value === "back";
  let email = user.email, who = "";
  if (isOwner){
    const v = $("tby").value;
    if (v && v !== "__me"){ email = v; who = v; } else who = "Jacob";
  } else {
    who = $("tname").value.trim();
  }
  if (!who) return alert("Type your name.");
  const rows = FLAVORS.map((n, i) => ({name: n, tk: Number($("tk" + i).value) || 0, br: Number($("br" + i).value) || 0, dm: Number($("dm" + i).value) || 0}));
  const on = $("oname").value.trim();
  if (on){
    const o = {name: on, tk: Number($("tkx").value) || 0, br: Number($("brx").value) || 0, dm: Number($("dmx").value) || 0};
    const same = rows.find(r => low(r.name) === low(on));
    if (same){ same.tk += o.tk; same.br += o.br; same.dm += o.dm; } else rows.push(o);
  }
  const items = {};
  let total = 0, back = 0, dmg = 0, bad = false, extra = false;
  rows.forEach(r => {
    if (r.br || r.dm) extra = true;
    if (r.tk > 0 || r.br > 0 || r.dm > 0){
      if (r.br + r.dm > r.tk) bad = true;
      items[r.name] = done ? {taken: r.tk, returned: r.br, damaged: r.dm} : {taken: r.tk};
      total += r.tk; back += r.br; dmg += r.dm;
    }
  });
  if (!(total > 0)) return alert("Type how many pops were taken.");
  if (bad) return alert("Returned plus damaged cannot be more than taken.");
  if (extra && !done) return alert("Set the status to 'Came back' to save Returned and Damaged.");
  const ts = date === today() ? Date.now() : new Date(date + "T12:00:00").getTime();
  try {
    await addDoc(collection(db, "trips"), {uid: user.uid, email: email, date: date, seller: who, taken: total, returned: done ? back : null, damaged: done ? dmg : 0, items: items, ts: ts});
    toast("Trip saved: " + total + " pops taken");
    FLAVORS.forEach((n, i) => { $("tk" + i).value = ""; $("br" + i).value = ""; $("dm" + i).value = ""; });
    $("oname").value = ""; $("tkx").value = ""; $("brx").value = ""; $("dmx").value = "";
    $("tstat").value = "out";
    $("tdate").value = today();
    if (!isOwner){ try { localStorage.setItem("sellerName", who); } catch(e){} }
  } catch(e){
    alert("Could not save: " + e.message);
  }
};
window.endTrip = async id => {
  const t = data.trips.find(x => x.id === id);
  if (!t) return;
  if (!t.items || !Object.keys(t.items).length){
    const v = prompt("How many pops came back?");
    if (v === null) return;
    const n = Number(v);
    if (isNaN(n) || n < 0) return alert("Type a number.");
    await updateDoc(doc(db, "trips", id), {returned: n});
    return;
  }
  const items = {};
  let back = 0, dmg = 0, bad = false;
  Object.keys(t.items).forEach((n, i) => {
    const el = $("rt_" + id + "_" + i);
    const ed = $("rd_" + id + "_" + i);
    const v = el ? Number(el.value) || 0 : 0;
    const w = ed ? Number(ed.value) || 0 : 0;
    if (v < 0 || w < 0 || v + w > t.items[n].taken) bad = true;
    items[n] = {taken: t.items[n].taken, returned: v, damaged: w};
    back += v; dmg += w;
  });
  if (bad) return alert("Back plus damaged cannot be more than taken.");
  await updateDoc(doc(db, "trips", id), {items: items, returned: back, damaged: dmg});
};
window.addSale = async () => {
  const date = $("sdate").value || today();
  if (date > today()) return alert("The date cannot be in the future.");
  let email = user.email, who = "";
  if (isOwner){
    const v = $("sby").value;
    if (v && v !== "__me"){ email = v; who = v; } else who = "Jacob";
  } else {
    who = $("sname").value.trim();
  }
  const flav = $("flav").value.trim();
  const q = Number($("qty").value);
  const p = Number($("price").value);
  if (!who) return alert("Type your name.");
  if (!flav) return alert("Type the flavour (e.g. Mango).");
  if (!(q > 0)) return alert("Type how many pops sold.");
  if (!(p > 0)) return alert("Type the price for one pop.");
  const ts = date === today() ? Date.now() : new Date(date + "T12:00:00").getTime();
  try {
    await addDoc(collection(db, "sales"), {uid: user.uid, email: email, date: date, seller: who, product: flav, customer: $("cust").value.trim(), qty: q, price: p, total: p * q, paid: $("pay").value === "paid", ts: ts});
    toast("Sale saved: " + q + " × " + flav + " = " + kes(p * q));
    $("qty").value = ""; $("cust").value = ""; $("flav").value = "";
    if (!isOwner){ try { localStorage.setItem("sellerName", who); } catch(e){} }
  } catch(e){
    alert("Could not save: " + e.message);
  }
};
window.paySale = id => updateDoc(doc(db, "sales", id), {paid: true});
window.addMade = async () => {
  const raw = $("mflav").value.trim();
  const q = Number($("mqty").value);
  const date = $("mdate").value || today();
  if (!raw) return alert("Type the flavour (e.g. Mango).");
  if (!q || isNaN(q)) return alert("Type how many pops. Use a minus number to take away.");
  if (date > today()) return alert("The date cannot be in the future.");
  const canon = FLAVORS.find(n => low(n) === low(raw)) || (raw.charAt(0).toUpperCase() + raw.slice(1));
  const ts = date === today() ? Date.now() : new Date(date + "T12:00:00").getTime();
  try {
    await addDoc(collection(db, "expenses"), {kind: "made", item: canon, amount: 0, qty: q, items: {[canon]: q}, date: date, ts: ts});
    toast("Saved: " + q + " " + canon);
    $("mqty").value = ""; $("mflav").value = "";
  } catch(e){
    alert("Could not save: " + e.message);
  }
};
window.editMade = async id => {
  const x = data.expenses.find(y => y.id === id);
  if (!x) return;
  const v = prompt("New number for " + x.item + "?", x.qty);
  if (v === null) return;
  const n = Number(v);
  if (!n || isNaN(n)) return alert("Type a number (not zero).");
  await updateDoc(doc(db, "expenses", id), {qty: n, items: {[x.item]: n}});
};
window.addExpense = async () => {
  const a = Number($("amt").value);
  if (!$("item").value || !(a > 0)) return alert("Type what for and the amount.");
  const items = {};
  let q = 0;
  FLAVORS.forEach((n, i) => { const v = Number($("mk" + i).value) || 0; if (v > 0){ items[n] = v; q += v; } });
  if (!(q > 0)) q = Number($("made").value) || 0;
  const rec = {item: $("item").value, amount: a, qty: q, date: today(), ts: Date.now()};
  if (Object.keys(items).length) rec.items = items;
  await addDoc(collection(db, "expenses"), rec);
  $("item").value = ""; $("amt").value = ""; $("made").value = "";
  FLAVORS.forEach((n, i) => { $("mk" + i).value = ""; });
};
window.addProduct = async () => {
  const p = Number($("pprice").value);
  if (!$("pname").value || !(p > 0)) return alert("Type the flavor and the price.");
  await addDoc(collection(db, "products"), {name: $("pname").value, price: p, ts: Date.now()});
  $("pname").value = ""; $("pprice").value = "";
};
window.delItem = async (col, id) => { if (confirm("Delete this?")) await deleteDoc(doc(db, col, id)); };

function sub(name, ref){
  let first = true;
  unsubs.push(onSnapshot(ref, snap => {
    data[name] = snap.docs.map(d => ({id: d.id, ...d.data()})).sort((a, b) => (b.ts||0) - (a.ts||0));
    if (isOwner && name === "sales" && !first){
      snap.docChanges().forEach(ch => {
        if (ch.type === "added" && !ch.doc.metadata.hasPendingWrites){
          const s = ch.doc.data();
          toast("New sale: " + (s.seller || s.email) + " sold " + s.qty + " " + s.product + " (" + kes(s.total) + ")");
        }
      });
    }
    first = false;
    refresh();
  }, err => toast("Error: " + err.message)));
}

onAuthStateChanged(auth, u => {
  unsubs.forEach(f => f()); unsubs = [];
  data = {products: [], trips: [], sales: [], expenses: [], users: [], sellers: []};
  if (!u){ user = null; showLogin(); return; }
  user = u;
  isOwner = low(u.email) === OWNER;
  tab = isOwner ? "summary" : "sales";
  setDoc(doc(db, "users", u.uid), {email: u.email, lastLogin: Date.now()}, {merge: true}).catch(() => {});
  shell();
  sub("products", collection(db, "products"));
  if (isOwner){
    sub("users", collection(db, "users"));
    sub("sellers", collection(db, "sellers"));
    sub("trips", collection(db, "trips"));
    sub("sales", collection(db, "sales"));
    sub("expenses", collection(db, "expenses"));
  } else {
    sub("trips", query(collection(db, "trips"), where("uid", "==", u.uid)));
    sub("sales", query(collection(db, "sales"), where("uid", "==", u.uid)));
  }
});
