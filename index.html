<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ice Pops Tracker</title>
<style>
body{font-family:Arial,sans-serif;max-width:480px;margin:0 auto;padding:16px;background:#f4fbff}
h1{color:#0a7bbf;text-align:center}
input,button{width:100%;padding:12px;margin:4px 0;font-size:16px;box-sizing:border-box}
button{background:#0a7bbf;color:#fff;border:none;border-radius:6px}
.card{background:#fff;padding:12px;margin:8px 0;border-radius:8px;box-shadow:0 1px 3px #ccc}
.sell{background:#2e9e4f}
.del{background:#c0392b}
.total{font-size:20px;text-align:center;color:#2e9e4f}
</style>
</head>
<body>
<h1>Ice Pops Tracker</h1>
<div class="card">
<input id="name" placeholder="Flavor (e.g. Mango)">
<input id="price" type="number" placeholder="Price">
<input id="stock" type="number" placeholder="Stock (how many)">
<button onclick="addItem()">Add flavor</button>
</div>
<p class="total" id="total"></p>
<div id="list"></div>
<script>
var items = JSON.parse(localStorage.getItem("pops") || "[]");
var sales = Number(localStorage.getItem("sales") || 0);
function save(){
  localStorage.setItem("pops", JSON.stringify(items));
  localStorage.setItem("sales", sales);
  show();
}
function addItem(){
  var n = document.getElementById("name").value;
  var p = Number(document.getElementById("price").value);
  var s = Number(document.getElementById("stock").value);
  if(!n || !p){ alert("Enter flavor and price"); return; }
  items.push({name:n, price:p, stock:s});
  document.getElementById("name").value = "";
  document.getElementById("price").value = "";
  document.getElementById("stock").value = "";
  save();
}
function sell(i){
  if(items[i].stock > 0){
    items[i].stock--;
    sales += items[i].price;
    save();
  } else { alert("Out of stock"); }
}
function restock(i){
  items[i].stock += 10;
  save();
}
function removeItem(i){
  items.splice(i, 1);
  save();
}
function show(){
  document.getElementById("total").innerHTML = "Total sales: " + sales;
  var html = "";
  for(var i = 0; i < items.length; i++){
    html += '<div class="card"><b>' + items[i].name + '</b><br>Price: ' + items[i].price + ' | Stock: ' + items[i].stock +
    '<button class="sell" onclick="sell(' + i + ')">Sell 1</button>' +
    '<button onclick="restock(' + i + ')">Add 10 stock</button>' +
    '<button class="del" onclick="removeItem(' + i + ')">Delete</button></div>';
  }
  document.getElementById("list").innerHTML = html;
}
show();
</script>
</body>
  </html>
